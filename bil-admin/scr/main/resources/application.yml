server:
  port: 7070
  tomcat:
    max-http-form-post-size: 50MB
  servlet:
    context-path: /admin

spring:
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  application:
    name: bil-admin
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/bilisql?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCPDatasource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  redis:
    database: 0
    host: 192.168.5.131
    port: 6379
    jedis:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 10
        min-idle: 0
    timeout: 2000
  elasticsearch:
    enabled: true
    uris: http://192.168.5.131:9200
    connection-timeout: 3s
    socket-timeout: 5s

# MyBatis 配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true

project:
  folder: d:/BilBil/bilweb
  video:
    upload-temp: d:/BilBil/bilweb/temp
    output: d:/BilBil/bilweb/videos

log:
  root:
    level: debug

admin:
  account: admin
  password: admin123

# Sentinel 流控熔断降级
sentinel:
  eager: true
  transport:
    dashboard: 192.168.5.131:8089
    port: 8722

seata:
  enabled: true
  application-id: bil-admin
  tx-service-group: bil-admin-seata-service-group
  service:
    vgroup-mapping:
      bil-admin-seata-service-group: default
    grouplist:
      default: 192.168.5.131:8091