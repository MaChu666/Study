server:
  port: 7071
  tomcat:
    max-swallow-size: 2GB
    max-http-form-post-size: 50MB
spring:
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

  application:
    name: bil-web
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/bilisql?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCPDatasource
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    jedis:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 10
        min-idle: 0
    timeout: 2000
#mybatis 婢堆冪毈閸愭瑨娴嗘す鐓庡槻
mybatis:
  configuration:
    map-underscore-to-camel-case: true

project:
  folder: d:/BilBil/bilweb
  video:
    upload-temp: d:/BilBil/bilweb/temp
    output: d:/BilBil/bilweb/videos
log:
  root:
    level: debug
