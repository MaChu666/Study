server:
  port: 7074
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/bilisql?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: 192.168.5.131
    port: 6379
    database: 0
    timeout: 2000
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

project:
  folder: D:/BilBil/bilweb
  video:
    upload-temp: D:/BilBil/bilweb/temp
    output: D:/BilBil/bilweb/videos
rocketmq:
  name-server: 192.168.5.131:9876
  producer:
    group: bil-interaction-producer
seata:
  enabled: true
  application-id: bil-interaction
  tx-service-group: bil-interaction-seata-service-group
  service:
    vgroup-mapping:
      bil-interaction-seata-service-group: default
    grouplist:
      default: 192.168.5.131:8091
sentinel:
  eager: true
  transport:
    dashboard: 192.168.5.131:8089
    port: 8724
